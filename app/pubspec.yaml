name: vidsnap
description: Privacy-first video downloader with WhatsApp status saver.
publish_to: 'none'
version: 1.1.3+5

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & downloads
  dio: ^5.5.0+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1

  # Media
  photo_manager: ^3.2.0
  video_player: ^2.9.1
  chewie: ^1.8.1
  ffmpeg_kit_flutter_new_min: ^3.6.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  file_picker: ^8.0.5
  open_filex: ^4.4.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#0E0F13"
  color_dark: "#0E0F13"
  android_12:
    color: "#0E0F13"
    color_dark: "#0E0F13"
    icon: "assets/icons/app_icon_foreground.png"
  android: true
  ios: false
  image: "assets/icons/app_icon.png"
  android_gravity: center

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0E0F13"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
