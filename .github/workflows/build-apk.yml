name: Build APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for creating GitHub Releases on tag push.
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Ensure gradle-wrapper.jar exists
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — downloading from Gradle 8.7 release…"
            curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
            ls -la android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Download Flutter dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Verify localization generated
        run: |
          ls -la lib/l10n/gen/ || true
          test -f lib/l10n/gen/app_localizations.dart || {
            echo "ERROR: app_localizations.dart was not generated";
            exit 1;
          }

      - name: Analyze code (warnings don't fail)
        run: flutter analyze || true

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECR: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECR: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECR: ${{ secrets.KEY_PASSWORD }}
        run: |
          # We deliberately do NOT auto-generate a keystore when the secrets
          # are missing. Auto-generated keystores differ between runs and
          # prevent users from updating the app (Android rejects APKs signed
          # with a different key than the one already installed).
          #
          # If any of the four required secrets are absent, fail loudly with
          # a clear message explaining what to set up.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Secret 'KEYSTORE_BASE64'."
            echo "::error::This build cannot produce a release-signed APK without a stable keystore."
            echo "::error::See the repo README (§ Signing) for how to generate one and add the secrets:"
            echo "::error::  KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD_SECR" ] || [ -z "$KEY_ALIAS_SECR" ] || [ -z "$KEY_PASSWORD_SECR" ]; then
            echo "::error::One or more signing secrets are missing."
            echo "::error::Required: KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (alongside KEYSTORE_BASE64)."
            exit 1
          fi

          echo "Decoding user-provided keystore from GitHub Secrets."
          # Write to a path under android/app/ that matches what key.properties expects.
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/vidsnap.jks

          # Verify the keystore is readable with the provided password.
          # This catches typos early instead of letting Gradle fail later.
          if ! keytool -list -keystore android/app/vidsnap.jks \
                -storepass "$KEYSTORE_PASSWORD_SECR" \
                -alias "$KEY_ALIAS_SECR" > /dev/null 2>&1; then
            echo "::error::Keystore verification failed. Check that KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD match the keystore you uploaded."
            exit 1
          fi

          # Write key.properties with printf (avoids YAML heredoc indentation issues).
          # Lines have NO leading whitespace — Gradle's Properties.load() is strict.
          {
            printf 'storeFile=vidsnap.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD_SECR"
            printf 'keyAlias=%s\n' "$KEY_ALIAS_SECR"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD_SECR"
          } > android/key.properties

          echo "Keystore ready. Signing release APK with the user-provided key."
          # Sanity check: confirm the file exists and has 4 entries.
          test -f android/key.properties || { echo "::error::key.properties was not created"; exit 1; }
          LINES=$(grep -c '=' android/key.properties || true)
          if [ "$LINES" -lt 4 ]; then
            echo "::error::key.properties is malformed (expected 4 entries, found $LINES)"
            exit 1
          fi
          # Print a redacted version for debugging (no secrets leaked).
          echo "key.properties (redacted):"
          sed 's/=.*/=<redacted>/' android/key.properties

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: List build output
        run: ls -la build/app/outputs/flutter-apk/

      - name: Rename APK with version + commit
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          COMMIT_SHORT=${GITHUB_SHA::7}
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          NEW_NAME="vidsnap-v${VERSION}-${COMMIT_SHORT}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$NEW_NAME"
          echo "apk_path=build/app/outputs/flutter-apk/$NEW_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Renamed to: $NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidsnap-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VidSnap ${{ github.ref_name }}
          generate_release_notes: true
          files: app/${{ steps.rename.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
