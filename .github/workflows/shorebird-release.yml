name: Shorebird Release

# =============================================================================
# Build a full Shorebird-enabled APK release.
#
# Shorebird is a code-push service for Flutter: it lets us push small Dart
# code/UI changes (button text, colors, simple logic) directly to installed
# apps without rebuilding a new APK and asking users to reinstall.
#
# This workflow produces the BASE release that all future patches will be
# built on top of. Run this whenever you bump the versionCode in pubspec.yaml
# (e.g. 1.1.0+2 → 1.1.1+3). For tiny changes between version bumps, use
# the shorebird-patch.yml workflow instead — it just ships a Dart patch,
# no APK rebuild needed.
#
# Required GitHub Secrets (already configured):
#   - KEYSTORE_BASE64     Base64-encoded .jks keystore file
#   - KEYSTORE_PASSWORD   Keystore store password
#   - KEY_ALIAS           Signing key alias (e.g. "vidsnap")
#   - KEY_PASSWORD        Signing key password
#   - SHOREBIRD_TOKEN     API key from https://console.shorebird.dev
#
# Trigger options:
#   - workflow_dispatch   Manual run from Actions tab
#   - push on v* tags     Auto-run when you push a tag like v1.2.0
# =============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Required for creating GitHub Releases

jobs:
  shorebird-release:
    name: Build & Publish Shorebird Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Shorebird ships its own fork of Flutter, so we don't need to install
      # Flutter separately. The setup-shorebird action handles everything.
      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Verify Shorebird installation & expose Flutter
        run: |
          shorebird --version
          # The setup-shorebird action adds `shorebird` to PATH but not `flutter`.
          # Shorebird's install path is stored in $install_path env var
          # (set by the setup-shorebird action) — defaults to ~/.config/shorebird
          # on Linux runners.
          SHOREBIRD_DIR="${install_path:-$HOME/.shorebird}"
          if [ ! -d "$SHOREBIRD_DIR" ]; then
            # Fallback for older setups
            SHOREBIRD_DIR="$HOME/.shorebird"
          fi
          echo "Shorebird install dir: $SHOREBIRD_DIR"
          FLUTTER_BIN_DIR=$(ls -d "$SHOREBIRD_DIR"/bin/cache/flutter/*/bin 2>/dev/null | head -1)
          if [ -z "$FLUTTER_BIN_DIR" ]; then
            echo "::error::Could not find Flutter binary under $SHOREBIRD_DIR"
            ls -la "$SHOREBIRD_DIR/bin/cache/" 2>&1 || true
            exit 1
          fi
          echo "Found Flutter at: $FLUTTER_BIN_DIR"
          echo "$FLUTTER_BIN_DIR" >> $GITHUB_PATH

      - name: Verify Flutter is on PATH
        run: flutter --version

      - name: Download Flutter dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Verify localization generated
        run: |
          ls -la lib/l10n/gen/ || true
          test -f lib/l10n/gen/app_localizations.dart || {
            echo "ERROR: app_localizations.dart was not generated";
            exit 1;
          }

      # Sign the APK with the stable keystore. Without this step the APK
      # cannot be updated over an existing install.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECR: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECR: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECR: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Fail loudly if any secret is missing — no auto-keystore fallback.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Secret 'KEYSTORE_BASE64'."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD_SECR" ] || [ -z "$KEY_ALIAS_SECR" ] || [ -z "$KEY_PASSWORD_SECR" ]; then
            echo "::error::One or more signing secrets are missing."
            exit 1
          fi

          echo "Decoding user-provided keystore from GitHub Secrets."
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/vidsnap.jks

          if ! keytool -list -keystore android/app/vidsnap.jks \
                -storepass "$KEYSTORE_PASSWORD_SECR" \
                -alias "$KEY_ALIAS_SECR" > /dev/null 2>&1; then
            echo "::error::Keystore verification failed."
            exit 1
          fi

          {
            printf 'storeFile=vidsnap.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD_SECR"
            printf 'keyAlias=%s\n' "$KEY_ALIAS_SECR"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD_SECR"
          } > android/key.properties

          echo "Keystore ready."

      # The shorebird release command:
      #   - Builds a release APK with the stable keystore
      #   - Uploads the Dart code + AOT artifacts to Shorebird's CDN
      #   - Returns a release version number (e.g. "1.1.0+2 / 1")
      # --artifact apk  : produce an APK (default is AAB which can't be
      #                    sideloaded by users)
      # --platforms android : only build for Android (skip iOS)
      - name: Build & publish Shorebird release
        env:
          # SHOREBIRD_TOKEN authenticates shorebird against your account.
          # The CLI reads this env var automatically — no need to run
          # `shorebird login` separately.
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release android --artifact apk --platforms android

      - name: List build output
        run: ls -la build/app/outputs/flutter-apk/

      - name: Rename APK with version + commit
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          COMMIT_SHORT=${GITHUB_SHA::7}
          NEW_NAME="vidsnap-v${VERSION}-${COMMIT_SHORT}-shorebird.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$NEW_NAME"
          echo "apk_path=build/app/outputs/flutter-apk/$NEW_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Renamed to: $NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidsnap-shorebird-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # Attach the APK to a GitHub Release (only when triggered by a v* tag).
      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VidSnap ${{ github.ref_name }} (Shorebird)
          generate_release_notes: true
          files: app/${{ steps.rename.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
